  /api/v1/webhooks/courier/steadfast:
    post:
      tags:
      - Webhooks
      summary: Steadfast parcel status callback
      operationId: post_v1_webhooks_courier_steadfast
      description: 'Controller: `SteadfastWebhookController`. Middleware: `api, RequireHttps, ThrottleRequests:steadfast-webhook,
        VerifySteadfastWebhookToken`.


        Order of checks: HTTPS (403 HTTPS_REQUIRED) -> rate limit (429 RATE_LIMITED) -> Authorization: Bearer STEADFAST_WEBHOOK_TOKEN
        (401 WEBHOOK_TOKEN_INVALID; 503 WEBHOOK_NOT_CONFIGURED if unset) -> validation (422) -> duplicate check (unique courier+consignment_id+status)
        -> delivered/partial_delivered re-checked with GET /status_by_cid (409 DELIVERY_NOT_CONFIRMED, 503 COURIER_UNAVAILABLE).
        Header format taken from the steadfast-laravel-package source; confirm on the first live callback.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SteadfastWebhook'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SteadfastWebhookResult'
        '401':
          description: WEBHOOK_TOKEN_INVALID
        '403':
          description: HTTPS_REQUIRED
        '409':
          description: DELIVERY_NOT_CONFIRMED
        '422':
          $ref: '#/components/responses/Validation'
        '429':
          description: RATE_LIMITED
        '503':
          description: WEBHOOK_NOT_CONFIGURED or COURIER_UNAVAILABLE
      security:
      - steadfastBearer: []
      x-status: implemented
      x-permission: HTTPS + bearer token (VerifySteadfastWebhookToken)
      x-target-permission: signature (bearer token)
      x-tenant-scope: consignments booked by the platform
      x-rate-limit: STEADFAST_WEBHOOK_RATE_LIMIT per minute per IP (default 120), counted before the token check
      x-audit-event: shipment.status_changed / shipment.delivered / shipment.cancelled
components:
  securitySchemes:
    sanctumSession:
      type: apiKey
      in: cookie
      name: laravel_session
      description: Session cookie set by login (cookie name follows SESSION_COOKIE / APP_NAME).
    xsrf:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: URL-decoded value of the XSRF-TOKEN cookie from /sanctum/csrf-cookie.
    steadfastBearer:
      type: http
      scheme: bearer
      description: STEADFAST_WEBHOOK_TOKEN, the same value entered in the Steadfast portal (documentation/security/steadfast.md).
  responses:
    Unauthenticated:
      description: Not signed in
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    NotAdmin:
      description: Signed in but not an admin ('Unauthorized. Admin access required.')
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    SessionExpired:
      description: Admin idle for more than ADMIN_IDLE_TIMEOUT_MINUTES (15), or CSRF token mismatch
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    Validation:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
  schemas:
    Message:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
    ValidationError:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    CodedError:
      type: object
      properties:
        message:
          type: string
        code:
          type: string
          example: INSUFFICIENT_STOCK
    AdminSession:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
          nullable: true
        user:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            email:
              type: string
            status:
              type: integer
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
    Paginated:
      type: object
      properties:
        current_page:
          type: integer
        data:
          type: array
          items:
            type: object
        per_page:
          type: integer
        total:
          type: integer
        last_page:
          type: integer
        next_page_url:
          type: string
          nullable: true
    LoginRequest:
      type: object
      properties:
        email:
