info:
  title: BazarBariOnline API
  version: 0.2.0-steadfast
  description: 'Generated from `php artisan route:list --json` on 2026-11-19 plus the endpoint inventory in spec section 10.3.


    Two sets of paths live in this file:


    * `/api/...` — **implemented today** (`x-status: implemented`): 105 operations from 105 routes in the single-shop code.

    * `/api/v1/...` — **planned MVP API** (`x-status: planned`), the target from spec 10.3. Each one moves to implemented
    as it is built (Definition of Done, spec 16.4). The first one already built is the Steadfast webhook `POST /api/v1/webhooks/courier/steadfast`
    (`x-status: implemented`).


    Extension fields on every operation: `x-permission` (what the code checks now), `x-target-permission` (from `documentation/permissions.md`),
    `x-tenant-scope`, `x-rate-limit`, `x-audit-event`, `x-known-issues`.


    **Authentication:** Sanctum SPA cookies (ADR-04). Call `GET /sanctum/csrf-cookie` first, then send `X-XSRF-TOKEN` and
    cookies from an origin listed in `SANCTUM_STATEFUL_DOMAINS` (`localhost:3000` locally). In the browser, Next.js rewrites
    `/api/*` and `/sanctum/*` to Laravel, so requests are same-origin.


    **Responses today** do not yet follow the `{data, meta}` envelope of spec 10.2: most return `{success, message, ...}`,
    Laravel paginator JSON or a bare model. The v1 API adopts the envelope and stable `code` values.'
